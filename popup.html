<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: system-ui, sans-serif; width: 220px; padding: 14px; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: flex; align-items: center; justify-content: space-between;
          margin-bottom: 10px; font-size: 13px; }
  input[type="checkbox"] { width: 16px; height: 16px; }
  p.hint { font-size: 11px; color: #777; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Block short-form content</h1>
  <label>YouTube Shorts <input type="checkbox" id="youtube"></label>
  <label>TikTok <input type="checkbox" id="tiktok"></label>
  <label>Instagram Reels <input type="checkbox" id="instagram"></label>
  <label>Facebook Reels <input type="checkbox" id="facebook"></label>
  <p class="hint">Reload the tab after changing a toggle.</p>
  <script src="popup.js"></script>
</body>
</html>
